<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>会话默认值</title>
    <style>
      :root {
        --bg: #ffffff;
        --text: #1a1a1a;
        --muted: #5f6368;
        --line: #dadce0;
        --accent: #1a73e8;
        --ok: #188038;
        --err: #d93025;
      }
      [data-theme="dark"] {
        --bg: #1f1f1f;
        --text: #e8eaed;
        --muted: #9aa0a6;
        --line: #3c4043;
        --accent: #8ab4f8;
        --ok: #81c995;
        --err: #f28b82;
      }
      body {
        margin: 0;
        padding: 20px;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 4px;
      }
      p.hint {
        color: var(--muted);
        margin: 0 0 18px;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      input[type="text"] {
        flex: 1;
        min-width: 0;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
      }
      button {
        padding: 8px 14px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
        white-space: nowrap;
      }
      button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      [data-theme="dark"] button.primary {
        color: #202124;
      }
      .actions {
        margin-top: 16px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      #status {
        color: var(--muted);
        font-size: 13px;
      }
      #status.ok {
        color: var(--ok);
      }
      #status.err {
        color: var(--err);
      }
      .note {
        margin-top: 22px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <h1>无会话上下文时的默认值</h1>
    <p class="hint">
      「没有对话链」的请求（例如 WebUI 里拉取模型列表的测试）会带上这个值。它必须非空，
      否则上游会返回 <code>400 MissingSessionID</code>。
    </p>

    <label for="value">默认值</label>
    <div class="row">
      <input id="value" type="text" spellcheck="false" autocomplete="off" />
      <button id="generate" type="button" title="生成一个随机 UUID">随机 UUID</button>
    </div>

    <div class="actions">
      <button id="save" class="primary" type="button">保存</button>
      <span id="status"></span>
    </div>

    <div class="note" id="note"></div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
